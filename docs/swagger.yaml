openapi: 3.0.0
info:
  title: API de Superhéroes y Villanos
  version: 1.0.0
  description: Una API simple para gestionar superhéroes, villanos y sus aventuras.

servers:
  - url: http://localhost:3001/api # La URL base de tu API, recuerda tu app.use('/api', ...)

tags:
  - name: Héroes
    description: Operaciones relacionadas con los superhéroes
  - name: Villanos
    description: Operaciones relacionadas con los villanos
  - name: Batallas # INICIO DE CAMBIO: Nuevo tag para organizar las batallas
    description: Operaciones relacionadas con la simulación de batallas
# FIN DE CAMBIO: Nuevo tag para organizar las batallas

paths:
  /heroes:
    get:
      summary: Obtiene todos los héroes
      tags:
        - Héroes
      responses:
        '200':
          description: Lista de héroes obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hero'
        '500':
          description: Error interno del servidor
    post:
      summary: Agrega un nuevo héroe
      tags:
        - Héroes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeroInput'
      responses:
        '201':
          description: Héroe agregado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hero'
        '400':
          description: Datos de entrada inválidos
        '500':
          description: Error interno del servidor

  /heroes/{id}: # <--- Bloque unificado para GET, PUT, DELETE
    get:
      summary: Obtiene un héroe por ID
      tags:
        - Héroes
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64 # INICIO DE CAMBIO: Usar int64 para IDs numéricos grandes si es necesario
          required: true
          description: ID del héroe a obtener
      responses:
        '200':
          description: Héroe encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hero'
        '404':
          description: Héroe no encontrado
        '500':
          description: Error interno del servidor
    put:
      summary: Actualiza un héroe existente
      tags:
        - Héroes
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64 # INICIO DE CAMBIO: Usar int64 para IDs numéricos grandes si es necesario
          required: true
          description: ID del héroe a actualizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeroInput'
      responses:
        '200':
          description: Héroe actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hero'
        '404':
          description: Héroe no encontrado
        '500':
          description: Error interno del servidor
    delete:
      summary: Elimina un héroe
      tags:
        - Héroes
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64 # INICIO DE CAMBIO: Usar int64 para IDs numéricos grandes si es necesario
          required: true
          description: ID del héroe a eliminar
      responses:
        '200':
          description: Héroe eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Héroe eliminado con éxito
        '404':
          description: Héroe no encontrado
        '500':
          description: Error interno del servidor

  /heroes/city/{city}:
    get:
      summary: Busca héroes por ciudad
      tags:
        - Héroes
      parameters:
        - in: path
          name: city
          schema:
            type: string
          required: true
          description: Nombre de la ciudad para buscar héroes
      responses:
        '200':
          description: Lista de héroes encontrada exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hero'
        '500':
          description: Error interno del servidor

  /heroes/{id}/enfrentar:
    post:
      summary: Hace que un héroe se enfrente a un villano
      tags:
        - Héroes
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64 # INICIO DE CAMBIO: Usar int64 para IDs numéricos grandes si es necesario
          required: true
          description: ID del héroe que enfrentará
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                villainId:
                  type: integer
                  format: int64 # INICIO DE CAMBIO: Usar int64 para IDs numéricos grandes si es necesario
                  description: ID del villano al que se enfrentará el héroe
                  example: 101 # INICIO DE CAMBIO: Ejemplo para ID de villano
              required:
                - villainId
      responses:
        '200':
          description: Enfrentamiento registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  hero:
                    type: object
                    properties:
                      id: { type: integer, format: int64 } # INICIO DE CAMBIO: Ajustar tipo de ID
                      alias: { type: string }
                      name: { type: string }
                      power: { type: integer }
                  villain:
                    type: object
                    properties:
                      id: { type: integer, format: int64 } # INICIO DE CAMBIO: Ajustar tipo de ID
                      alias: { type: string }
                      name: { type: string }
                      power: { type: integer }
                  outcome: { type: string, example: 'Batman (Bruce Wayne) derrota a Joker (Clown Prince of Crime)! ¡La justicia prevalece!' }
                  winner: { type: string, example: 'Batman' }
                  timestamp: { type: string, format: 'date-time' }
        '404':
          description: Héroe o villano no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Héroe no encontrado
        '500':
          description: Error interno del servidor

  # INICIO DE CAMBIO: Eliminación del antiguo endpoint /heroes/team-battle
  # El endpoint POST /heroes/team-battle ha sido reemplazado por /heroes/team-battle-interactive
  # Por lo tanto, se elimina su definición para evitar confusiones y reflejar la API actual.
  # FIN DE CAMBIO: Eliminación del antiguo endpoint /heroes/team-battle

  # INICIO DE NUEVA IMPLEMENTACIÓN: Endpoint para la Batalla Interactiva 3v3
  /heroes/team-battle-interactive:
    post:
      summary: Simula una batalla por equipos 3v3 interactiva con elección de bando y tipo de ataque.
      operationId: simulateInteractiveTeamBattle
      tags:
        - Batallas # Usamos el nuevo tag 'Batallas'
      requestBody:
        description: Detalles para iniciar una batalla por equipos interactiva.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - playerSide
                - playerTeamIds
                - playerAttackType
                - opponentTeamIds
              properties:
                playerSide:
                  type: string
                  description: El bando que el usuario desea controlar en la batalla.
                  enum: [hero, villain]
                  example: hero
                playerTeamIds:
                  type: array
                  items:
                    type: integer
                    format: int64 # IDs numéricos
                    minimum: 1
                  minItems: 3
                  maxItems: 3
                  description: Array de 3 IDs de los personajes para el equipo del jugador.
                  example: [1, 2, 3]
                playerAttackType:
                  type: string
                  description: El tipo de ataque que usará el equipo del jugador.
                  enum: [basic, power, critical]
                  example: power
                opponentTeamIds:
                  type: array
                  items:
                    type: integer
                    format: int64 # IDs numéricos
                    minimum: 1
                  minItems: 3
                  maxItems: 3
                  description: Array de 3 IDs de los personajes para el equipo oponente.
                  example: [101, 102, 103]
      responses:
        '200':
          description: Resultado detallado de la batalla por equipos interactiva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveBattleResult'
        '400':
          description: Solicitud inválida debido a datos faltantes o incorrectos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse' # Usamos un schema genérico de error
        '404':
          description: Uno o más personajes (Héroes/Villanos) no fueron encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  # FIN DE NUEVA IMPLEMENTACIÓN: Endpoint para la Batalla Interactiva 3v3

  /villains:
    get:
      summary: Obtiene todos los villanos
      tags:
        - Villanos
      responses:
        '200':
          description: Lista de villanos obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Villain'
        '500':
          description: Error interno del servidor
    post:
      summary: Agrega un nuevo villano
      tags:
        - Villanos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VillainInput'
      responses:
        '201':
          description: Villano agregado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Villain'
        '400':
          description: Datos de entrada inválidos
        '500':
          description: Error interno del servidor

  /villains/{id}:
    get:
      summary: Obtiene un villano por ID
      tags:
        - Villanos
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64 # INICIO DE CAMBIO: Usar int64 para IDs numéricos grandes si es necesario
          required: true
          description: ID del villano a obtener
      responses:
        '200':
          description: Villano encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Villain'
        '404':
          description: Villano no encontrado
        '500':
          description: Error interno del servidor
    put:
      summary: Actualiza un villano existente
      tags:
        - Villanos
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64 # INICIO DE CAMBIO: Usar int64 para IDs numéricos grandes si es necesario
          required: true
          description: ID del villano a actualizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VillainInput'
      responses:
        '200':
          description: Villano actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Villain'
        '404':
          description: Villano no encontrado
        '500':
          description: Error interno del servidor
    delete:
      summary: Elimina un villano
      tags:
        - Villanos
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64 # INICIO DE CAMBIO: Usar int64 para IDs numéricos grandes si es necesario
          required: true
          description: ID del villano a eliminar
      responses:
        '200':
          description: Villano eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Villano eliminado con éxito
        '404':
          description: Villano no encontrado
        '500':
          description: Error interno del servidor

  /villains/city/{city}:
    get:
      summary: Busca villanos por ciudad
      tags:
        - Villanos
      parameters:
        - in: path
          name: city
          schema:
            type: string
          required: true
          description: Nombre de la ciudad para buscar villanos
      responses:
        '200':
          description: Lista de villanos encontrada exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Villain'
        '500':
          description: Error interno del servidor


components:
  schemas:
    # INICIO DE CAMBIO: Actualización de schemas Hero y Villain para incluir '_id', 'power' y 'health'
    Hero:
      type: object
      properties:
        id: # Este campo 'id' en la respuesta se mapeará desde '_id' del documento de MongoDB
          type: integer
          format: int64
          readOnly: true # El ID es generado/controlado por la DB/sistema
          example: 1
        name:
          type: string
          example: Clark Kent
        alias:
          type: string
          example: Superman
        city:
          type: string
          example: Metrópolis
        team:
          type: string
          example: Liga de la Justicia
        power: # Añadido el campo 'power'
          type: integer
          example: 100
        health: # Añadido el campo 'health'
          type: integer
          example: 100
      required:
        - name
        - alias
        - power # Ahora requerido si lo usas en el modelo
        - health # Ahora requerido si lo usas en el modelo

    HeroInput:
      type: object
      properties:
        # No se incluye 'id' aquí porque es para la creación y el ID lo proporciona el JSON/DB
        name:
          type: string
          example: Peter Parker
        alias:
          type: string
          example: Spider-Man
        city:
          type: string
          example: New York
        team:
          type: string
          example: Avengers
        power: # Añadido el campo 'power'
          type: integer
          example: 50
        health: # Añadido el campo 'health'
          type: integer
          example: 100
      required:
        - name
        - alias
        - power
        - health

    Villain:
      type: object
      properties:
        id: # Este campo 'id' en la respuesta se mapeará desde '_id' del documento de MongoDB
          type: integer
          format: int64
          readOnly: true # El ID es generado/controlado por la DB/sistema
          example: 101
        name:
          type: string
          example: Lex Luthor
        alias:
          type: string
          example: Cerebro Maligno
        powers:
          type: array
          items:
            type: string
          example: ["Genius Intellect", "Kryptonite Armor"]
        power: # Añadido el campo 'power'
          type: integer
          example: 90
        health: # Añadido el campo 'health'
          type: integer
          example: 100
      required:
        - name
        - alias
        - power # Ahora requerido si lo usas en el modelo
        - health # Ahora requerido si lo usas en el modelo

    VillainInput:
      type: object
      properties:
        # No se incluye 'id' aquí
        name:
          type: string
          example: Joker
        alias:
          type: string
          example: Clown Prince of Crime
        powers:
          type: array
          items:
            type: string
          example: ["Chaos Incarnate", "Criminal Mastermind"]
        power: # Añadido el campo 'power'
          type: integer
          example: 70
        health: # Añadido el campo 'health'
          type: integer
          example: 100
      required:
        - name
        - alias
        - power
        - health
    # FIN DE CAMBIO: Actualización de schemas Hero y Villain

    # INICIO DE NUEVA IMPLEMENTACIÓN: Schemas de componentes para la nueva funcionalidad de batalla
    InteractiveBattleResult:
      type: object
      properties:
        message:
          type: string
          description: Mensaje final de la batalla.
          example: "¡El equipo de Héroes ha ganado la batalla!"
        battleDetails:
          type: object
          properties:
            heroes:
              type: array
              items:
                $ref: '#/components/schemas/BattleParticipantStatus'
            villains:
              type: array
              items:
                $ref: '#/components/schemas/BattleParticipantStatus'
            winner:
              type: string
              description: El equipo ganador.
              example: "Equipo de Héroes"
            roundsFought:
              type: integer
              description: Número total de rondas de la batalla.
              example: 15
            log:
              type: array
              items:
                type: string
              description: Registro detallado de cada acción en la batalla.
            playerSide:
              type: string
              description: El bando que el usuario eligió para controlar.
              enum: [hero, villain]
              example: hero
            playerAttackType:
              type: string
              description: El tipo de ataque que el usuario eligió para su equipo.
              enum: [basic, power, critical]
              example: power
      required:
        - message
        - battleDetails

    BattleParticipantStatus: # Schema para el estado de un personaje en batalla
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID del personaje.
          example: 1
        alias:
          type: string
          description: Alias del personaje.
          example: "Superman"
        name:
          type: string
          description: Nombre real del personaje.
          example: "Clark Kent"
        power:
          type: number
          description: Nivel de poder del personaje.
          example: 100
        initialHealth:
          type: number
          description: Salud inicial del personaje al comienzo de la batalla.
          example: 100
        remainingHealth:
          type: number
          description: Salud restante del personaje al final de la batalla.
          example: 25
        attackTypeUsed:
          type: string
          description: Tipo de ataque que el personaje utilizó durante la batalla.
          enum: [basic, power, critical]
          example: power
      required:
        - id
        - alias
        - power
        - initialHealth
        - remainingHealth
        - attackTypeUsed

    ErrorResponse: # Un schema genérico para errores
      type: object
      properties:
        error:
          type: string
          description: Mensaje de error.
          example: "Héroe con ID 999 no encontrado."
        errors: # Para errores de validación, si tu router devuelve un array de errores
          type: array
          items:
            type: object
            properties:
              msg: { type: string, example: "Debe proporcionar exactamente 3 IDs para héroes." }
              param: { type: string, example: "heroIds" }
              location: { type: string, example: "body" }
      # Puedes hacer 'error' o 'errors' requerido, o ambos opcionales si la respuesta puede variar
      # required:
      #   - error # O 'errors' dependiendo de tu implementación de manejo de errores
    # FIN DE NUEVA IMPLEMENTACIÓN: Schemas de componentes para la nueva funcionalidad de batalla