openapi: 3.0.0
info:
  title: API de Superhéroes y Villanos
  version: 1.0.0
  description: Una API simple para gestionar superhéroes, villanos y sus aventuras.

servers:
  - url: http://localhost:3001/api # La URL base de tu API

tags:
  - name: Héroes
    description: Operaciones relacionadas con los superhéroes
  - name: Villanos
    description: Operaciones relacionadas con los villanos
  - name: Batallas
    description: Operaciones relacionadas con la simulación de batallas interactivas

paths:
  /heroes:
    get:
      summary: Obtiene todos los héroes
      tags:
        - Héroes
      responses:
        '200':
          description: Lista de héroes obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hero'
        '500':
          description: Error interno del servidor
    post:
      summary: Agrega un nuevo héroe
      tags:
        - Héroes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeroInput'
      responses:
        '201':
          description: Héroe agregado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hero'
        '400':
          description: Datos de entrada inválidos
        '500':
          description: Error interno del servidor

  /heroes/{id}:
    get:
      summary: Obtiene un héroe por ID
      tags:
        - Héroes
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64
          required: true
          description: ID del héroe a obtener
      responses:
        '200':
          description: Héroe encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hero'
        '404':
          description: Héroe no encontrado
        '500':
          description: Error interno del servidor
    put:
      summary: Actualiza un héroe existente
      tags:
        - Héroes
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64
          required: true
          description: ID del héroe a actualizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeroInput'
      responses:
        '200':
          description: Héroe actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hero'
        '404':
          description: Héroe no encontrado
        '500':
          description: Error interno del servidor
    delete:
      summary: Elimina un héroe
      tags:
        - Héroes
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64
          required: true
          description: ID del héroe a eliminar
      responses:
        '200':
          description: Héroe eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Héroe eliminado con éxito
        '404':
          description: Héroe no encontrado
        '500':
          description: Error interno del servidor

  /heroes/city/{city}:
    get:
      summary: Busca héroes por ciudad
      tags:
        - Héroes
      parameters:
        - in: path
          name: city
          schema:
            type: string
          required: true
          description: Nombre de la ciudad para buscar héroes
      responses:
        '200':
          description: Lista de héroes encontrada exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hero'
        '500':
          description: Error interno del servidor

  /heroes/{id}/enfrentar:
    post:
      summary: Hace que un héroe se enfrente a un villano
      tags:
        - Héroes
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64
          required: true
          description: ID del héroe que enfrentará
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                villainId:
                  type: integer
                  format: int64
                  description: ID del villano al que se enfrentará el héroe
                  example: 101
              required:
                - villainId
      responses:
        '200':
          description: Enfrentamiento registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  hero:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      alias: { type: string }
                      name: { type: string }
                      power: { type: integer }
                  villain:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      alias: { type: string }
                      name: { type: string }
                      power: { type: integer }
                  outcome: { type: string, example: 'Batman (Bruce Wayne) derrota a Joker (Clown Prince of Crime)! ¡La justicia prevalece!' }
                  winner: { type: string, example: 'Batman' }
                  timestamp: { type: string, format: 'date-time' }
        '404':
          description: Héroe o villano no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Héroe no encontrado
        '500':
          description: Error interno del servidor

  # INICIO DE NUEVOS ENDPOINTS PARA BATALLA INTERACTIVA POR TURNOS
  /heroes/interactive-battle/start: # Renombrado y modificado
    post:
      summary: Inicia una nueva batalla por equipos 3v3 interactiva.
      operationId: startInteractiveTeamBattle
      tags:
        - Batallas
      requestBody:
        description: Parámetros iniciales para una batalla interactiva.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BattleStartRequest'
      responses:
        '200':
          description: Batalla iniciada exitosamente. Devuelve el ID de la batalla y su estado inicial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattleStartResponse'
        '400':
          description: Solicitud inválida debido a datos faltantes o incorrectos (ej. IDs duplicados, número incorrecto de personajes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Uno o más personajes (Héroes/Villanos) no fueron encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /heroes/interactive-battle/{battleId}/turn: # Nuevo endpoint para cada turno
    post:
      summary: Procesa un turno en una batalla interactiva existente.
      operationId: processBattleTurn
      tags:
        - Batallas
      parameters:
        - in: path
          name: battleId
          schema:
            type: string # UUID o similar
            format: uuid # Si usas UUIDs
          required: true
          description: ID de la batalla interactiva activa.
      requestBody:
        description: Acciones del jugador para la ronda actual.
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PlayerAction' # Un array de acciones, una por personaje que el jugador controla
              minItems: 1
              maxItems: 3 # Máximo 3 acciones por el equipo de 3 personajes
      responses:
        '200':
          description: Turno procesado. Devuelve el estado actualizado de la batalla.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattleState' # Devuelve el estado completo de la batalla
        '400':
          description: Solicitud inválida (ej. acciones no válidas, personaje ya derrotado, tipo de ataque inválido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Batalla no encontrada con el ID proporcionado o personaje no pertenece al equipo del jugador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409': # Conflict
          description: La batalla ya ha terminado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  # FIN DE NUEVOS ENDPOINTS PARA BATALLA INTERACTIVA POR TURNOS

  /villains:
    get:
      summary: Obtiene todos los villanos
      tags:
        - Villanos
      responses:
        '200':
          description: Lista de villanos obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Villain'
        '500':
          description: Error interno del servidor
    post:
      summary: Agrega un nuevo villano
      tags:
        - Villanos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VillainInput'
      responses:
        '201':
          description: Villano agregado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Villain'
        '400':
          description: Datos de entrada inválidos
        '500':
          description: Error interno del servidor

  /villains/{id}:
    get:
      summary: Obtiene un villano por ID
      tags:
        - Villanos
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64
          required: true
          description: ID del villano a obtener
      responses:
        '200':
          description: Villano encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Villain'
        '404':
          description: Villano no encontrado
        '500':
          description: Error interno del servidor
    put:
      summary: Actualiza un villano existente
      tags:
        - Villanos
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64
          required: true
          description: ID del villano a actualizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VillainInput'
      responses:
        '200':
          description: Villano actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Villain'
        '404':
          description: Villano no encontrado
        '500':
          description: Error interno del servidor
    delete:
      summary: Elimina un villano
      tags:
        - Villanos
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64
          required: true
          description: ID del villano a eliminar
      responses:
        '200':
          description: Villano eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Villano eliminado con éxito
        '404':
          description: Villano no encontrado
        '500':
          description: Error interno del servidor

  /villains/city/{city}:
    get:
      summary: Busca villanos por ciudad
      tags:
        - Villanos
      parameters:
        - in: path
          name: city
          schema:
            type: string
          required: true
          description: Nombre de la ciudad para buscar villanos
      responses:
        '200':
          description: Lista de villanos encontrada exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Villain'
        '500':
          description: Error interno del servidor


components:
  schemas:
    Hero:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        name:
          type: string
          example: Clark Kent
        alias:
          type: string
          example: Superman
        city:
          type: string
          example: Metrópolis
        team:
          type: string
          example: Liga de la Justicia
        power:
          type: integer
          example: 100
        health:
          type: integer
          example: 100
      required:
        - name
        - alias
        - power
        - health

    HeroInput:
      type: object
      properties:
        name:
          type: string
          example: Peter Parker
        alias:
          type: string
          example: Spider-Man
        city:
          type: string
          example: New York
        team:
          type: string
          example: Avengers
        power:
          type: integer
          example: 50
        health:
          type: integer
          example: 100
      required:
        - name
        - alias
        - power
        - health

    Villain:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 101
        name:
          type: string
          example: Lex Luthor
        alias:
          type: string
          example: Cerebro Maligno
        powers:
          type: array
          items:
            type: string
          example: ["Genius Intellect", "Kryptonite Armor"]
        power:
          type: integer
          example: 90
        health:
          type: integer
          example: 100
      required:
        - name
        - alias
        - power
        - health

    VillainInput:
      type: object
      properties:
        name:
          type: string
          example: Joker
        alias:
          type: string
          example: Clown Prince of Crime
        powers:
          type: array
          items:
            type: string
          example: ["Chaos Incarnate", "Criminal Mastermind"]
        power:
          type: integer
          example: 70
        health:
          type: integer
          example: 100
      required:
        - name
        - alias
        - power
        - health

    # INICIO DE NUEVOS SCHEMAS PARA LA BATALLA POR TURNOS
    BattleStartRequest:
      type: object
      properties:
        playerSide:
          type: string
          description: El bando que el usuario desea controlar en la batalla.
          enum: [hero, villain]
          example: hero
        playerTeamIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          minItems: 3
          maxItems: 3
          description: Array de 3 IDs de los personajes para el equipo del jugador.
          example: [1, 2, 3]
        opponentTeamIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          minItems: 3
          maxItems: 3
          description: Array de 3 IDs de los personajes para el equipo oponente.
          example: [101, 102, 103]
      required:
        - playerSide
        - playerTeamIds
        - opponentTeamIds

    BattleStartResponse:
      type: object
      properties:
        battleId:
          type: string
          format: uuid
          description: ID único de la sesión de batalla.
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        initialState:
          $ref: '#/components/schemas/BattleState' # Devuelve el estado completo inicial
      required:
        - battleId
        - initialState

    PlayerAction:
      type: object
      properties:
        characterId:
          type: integer
          format: int64
          description: ID del personaje del jugador que realizará una acción en este turno.
          example: 1
        attackType:
          type: string
          description: Tipo de ataque a usar en este turno.
          enum: [basic, power, critical]
          example: power
        targetId:
          type: integer
          format: int64
          description: (Opcional) ID del personaje oponente al que se desea atacar. Si no se especifica, se elige un objetivo aleatorio.
          example: 101
      required:
        - characterId
        - attackType

    BattleState: # Representa el estado actual de la batalla
      type: object
      properties:
        battleId:
          type: string
          format: uuid
          readOnly: true
          description: ID único de la sesión de batalla.
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        roundNumber:
          type: integer
          description: Número de la ronda actual.
          example: 1
        playerTeam:
          type: array
          items:
            $ref: '#/components/schemas/BattleCharacterStatus' # Estado detallado de los personajes del jugador
          minItems: 3
          maxItems: 3
        opponentTeam:
          type: array
          items:
            $ref: '#/components/schemas/BattleCharacterStatus' # Estado detallado de los personajes del oponente
          minItems: 3
          maxItems: 3
        currentLog:
          type: array
          items:
            type: string
          description: Nuevos eventos ocurridos en la última ronda.
          example: ["Superman ataca a Lex Luthor con ataque de poder. Lex Luthor pierde 30 de vida.", "Joker contraataca a Batman."]
        overallLog:
          type: array
          items:
            type: string
          description: Registro acumulado de todos los eventos de la batalla.
        status:
          type: string
          enum: [ongoing, player_won, opponent_won, draw]
          description: Estado actual de la batalla.
          example: ongoing
        winner:
          type: string
          nullable: true
          description: El equipo ganador (si la batalla ha terminado).
          example: "player_team"

    BattleCharacterStatus: # Estado de un solo personaje en la batalla (actualizado para incluir vida actual)
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID del personaje.
          example: 1
        alias:
          type: string
          description: Alias del personaje.
          example: "Superman"
        name:
          type: string
          description: Nombre real del personaje.
          example: "Clark Kent"
        type:
          type: string
          enum: [hero, villain]
          description: Tipo de personaje.
          example: hero
        power:
          type: number
          description: Nivel de poder del personaje.
          example: 100
        initialHealth:
          type: number
          description: Salud inicial del personaje.
          example: 100
        currentHealth:
          type: number
          description: Salud actual del personaje.
          example: 70
        isDefeated:
          type: boolean
          description: Indica si el personaje ha sido derrotado.
          example: false
      required:
        - id
        - alias
        - type
        - power
        - initialHealth
        - currentHealth
        - isDefeated

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Mensaje de error.
          example: "Batalla no encontrada."
        errors:
          type: array
          items:
            type: object
            properties:
              msg: { type: string, example: "El ID del personaje no es válido." }
              param: { type: string, example: "characterId" }
              location: { type: string, example: "body" }
    # FIN DE NUEVOS SCHEMAS PARA LA BATALLA POR TURNOS